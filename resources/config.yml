---
# Available languages:
# eng (English)
# vie (Tiếng Việt)
language: "eng"

# Plugin's prefix
prefix: "&f[&cProfanityFilter&f]&r "

# Send a warning to players if their messages contain profanity
warningMode: true

# Format of messages sent to Console
warningMessage: "{playerName} > {msg}"

# Character used to replace filtered words
characterReplaced: "*"

# Show profanity on the console
showProfanity: true

# Temporarily block players who repeatedly use profanity
violationMode: true

# Number of profanity messages before the player is muted
# Set to 0 to disable the violation counter
maxViolations: 3

# Mute duration in seconds after reaching maxViolations
muteDuration: 60
...
